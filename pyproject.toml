[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagevault"
version = "0.1.0"
description = "DuckDB-backed local database for phage genomes, proteins, and their annotations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=0.10",
    "biopython>=1.81",
    "pyrodigal>=3.0",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.scripts]
phagevault = "phagevault.cli:main"

[tool.setuptools.packages.find]
include = ["phagevault*"]
